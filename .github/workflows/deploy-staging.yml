name: Deploy to Staging

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: write

jobs:
  deploy-staging:
    name: Deploy Worker (staging)
    runs-on: ubuntu-latest
    needs: [] # corre en paralelo con CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Deploy a staging
        run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Comentar URL de staging en el PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = 'https://cloudfire-apiv1-staging.wrcp20.workers.dev'
            const body = `🚀 **Staging deploy exitoso**\n\n**URL:** ${url}\n\n_Desplegado desde commit \`${context.sha.slice(0,7)}\`_`
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            })
